name: NYC Mobility CI/CD

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "resources/**"
      - "databricks.yml"
      - ".github/workflows/ci-cd.yml"
      - ".gitignore"

  push:
    branches:
      - main
      - develop
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "resources/**"
      - "databricks.yml"
      - ".github/workflows/ci-cd.yml"
      - ".gitignore"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyc-mobility-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Check whitespace errors
        run: git diff --check

      - name: Run tests
        run: pytest tests/ -v

  ingest_weather:
    name: Ingest Open-Meteo weather data (dlt)
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dlt
        run: |
          python -m pip install --upgrade pip
          pip install "dlt[databricks]" "dlt[parquet]"

      - name: Run dlt weather ingestion
        env:
          DESTINATION__DATABRICKS__CREDENTIALS__SERVER_HOSTNAME: ${{ secrets.DATABRICKS_HOST }}
          DESTINATION__DATABRICKS__CREDENTIALS__HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DESTINATION__DATABRICKS__CREDENTIALS__ACCESS_TOKEN: ${{ secrets.DLT_ACCESS_TOKEN }}
          DESTINATION__DATABRICKS__CREDENTIALS__CATALOG: nyc
        run: python src/sql/01_bronze_ingest/dlt_ingest_weather.py

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Trigger Databricks job run
        # Only runs if the ingestion step above succeeded — GitHub Actions
        # skips remaining steps in a job by default after a failure, so
        # clean_weather_dlt/dim_weather_dlt/fact_taxi_trip_dlt never run
        # against stale or missing Bronze data.
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks jobs run-now 642225294826280

  deploy-dev:
    name: Deploy to DEV
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks Bundle
        run: databricks bundle validate --target dev

      - name: Deploy Databricks Bundle
        run: databricks bundle deploy --target dev

  deploy-prod:
    name: Deploy to PROD
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks Bundle
        run: databricks bundle validate --target prod

      - name: Deploy Databricks Bundle
        run: databricks bundle deploy --target prod
