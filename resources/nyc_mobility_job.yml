resources:
  jobs:
    nyc_mobility_pipeline:

      name: NYC Mobility Pipeline

      # FAILURE EMAIL NOTIFICATIONS
      email_notifications:
        on_failure:
          - razzelle.boreros@ftwfoundation.org
          - sara.celadina@ftwfoundation.org
          - maeve.lumague@ftwfoundation.org
          - tricia.taneo@ftwfoundation.org
          - alleanna.villan@ftwfoundation.org

      # SERVERLESS PYTHON ENVIRONMENT

      environments:
        - environment_key: default
          spec:
            environment_version: "2"

      # PIPELINE TASKS

      tasks:

        # 00 - SETUP

        - task_key: init_schemas

          sql_task:
            file:
              path: ../src/sql/00_setup/00_init_schemas.sql
            warehouse_id: 8414776a94d0039f


        - task_key: download_green_taxi

          depends_on:
            - task_key: init_schemas

          environment_key: default

          spark_python_task:
            python_file: ../src/sql/00_setup/download_green_taxi.py

          # RETRY POLICY
          max_retries: 2
          min_retry_interval_millis: 30000

          notification_settings:
            alert_on_last_attempt: true


        - task_key: download_open_meteo

          depends_on:
            - task_key: init_schemas

          environment_key: default

          spark_python_task:
            python_file: ../src/sql/00_setup/download_open_meteo.py

          # RETRY POLICY
          max_retries: 2
          min_retry_interval_millis: 30000

          notification_settings:
            alert_on_last_attempt: true


        - task_key: download_taxi_zones

          depends_on:
            - task_key: init_schemas

          environment_key: default

          spark_python_task:
            python_file: ../src/sql/00_setup/download_taxi_zones.py

          # RETRY POLICY
          max_retries: 2
          min_retry_interval_millis: 30000

          notification_settings:
            alert_on_last_attempt: true


        # 01 - BRONZE INGESTION

        - task_key: ingest_green_taxi

          depends_on:
            - task_key: download_green_taxi

          environment_key: default

          spark_python_task:
            python_file: ../src/sql/01_bronze_ingest/ingest_green_taxi.py

          # RETRY POLICY
          max_retries: 2
          min_retry_interval_millis: 30000

          notification_settings:
            alert_on_last_attempt: true


        - task_key: ingest_open_meteo

          depends_on:
            - task_key: download_open_meteo

          environment_key: default

          spark_python_task:
            python_file: ../src/sql/01_bronze_ingest/ingest_open_meteo.py

          # RETRY POLICY
          max_retries: 2
          min_retry_interval_millis: 30000

          notification_settings:
            alert_on_last_attempt: true


        - task_key: ingest_taxi_zones

          depends_on:
            - task_key: download_taxi_zones

          environment_key: default

          spark_python_task:
            python_file: ../src/sql/01_bronze_ingest/ingest_taxi_zones.py

          # RETRY POLICY
          max_retries: 2
          min_retry_interval_millis: 30000

          notification_settings:
            alert_on_last_attempt: true


        # 02 - SILVER CLEANING

        - task_key: clean_green_taxi

          depends_on:
            - task_key: ingest_green_taxi

          sql_task:
            file:
              path: ../src/sql/02_silver_clean/clean_green_taxi.sql
            warehouse_id: 8414776a94d0039f


        - task_key: clean_taxi_zones

          depends_on:
            - task_key: ingest_taxi_zones

          sql_task:
            file:
              path: ../src/sql/02_silver_clean/clean_taxi_zones.sql
            warehouse_id: 8414776a94d0039f


        - task_key: clean_weather

          depends_on:
            - task_key: ingest_open_meteo

          sql_task:
            file:
              path: ../src/sql/02_silver_clean/clean_weather.sql
            warehouse_id: 8414776a94d0039f


        # 03 - GOLD MODEL

        - task_key: dim_datetime

          depends_on:
            - task_key: clean_green_taxi

          sql_task:
            file:
              path: ../src/sql/03_gold_model/dim_datetime.sql
            warehouse_id: 8414776a94d0039f


        - task_key: dim_location

          depends_on:
            - task_key: clean_taxi_zones

          sql_task:
            file:
              path: ../src/sql/03_gold_model/dim_location.sql
            warehouse_id: 8414776a94d0039f


        - task_key: dim_weather

          depends_on:
            - task_key: clean_weather

          sql_task:
            file:
              path: ../src/sql/03_gold_model/dim_weather.sql
            warehouse_id: 8414776a94d0039f


        - task_key: fact_taxi_trip

          depends_on:
            - task_key: clean_green_taxi
            - task_key: dim_datetime
            - task_key: dim_location
            - task_key: dim_weather

          sql_task:
            file:
              path: ../src/sql/03_gold_model/fact_taxi_trip.sql
            warehouse_id: 8414776a94d0039f


        # 05 - ANALYTICS

        - task_key: taxi_demand

          depends_on:
            - task_key: fact_taxi_trip

          sql_task:
            file:
              path: ../src/sql/05_analytics/taxi_demand.sql
            warehouse_id: 8414776a94d0039f


        - task_key: weather_demand_trip_behavior

          depends_on:
            - task_key: fact_taxi_trip

          sql_task:
            file:
              path: ../src/sql/05_analytics/weather_demand_trip_behavior.sql
            warehouse_id: 8414776a94d0039f


        - task_key: strongest_mobility_patterns

          depends_on:
            - task_key: fact_taxi_trip

          sql_task:
            file:
              path: ../src/sql/05_analytics/strongest_mobility_patterns.sql
            warehouse_id: 8414776a94d0039f
